tmux:
    symbols:
        branch: " "
        hashprefix: ":"
        ahead: "↑"
        behind: "↓"
        staged: "+"
        conflict: "!"
        modified: "~"
        untracked: "?"
        stashed: "⚑"
        insertions: "Σ"
        deletions: "Δ"
        clean: "✓"

    styles:
        clear: "#[none]#[fg=#a9b1d6,bg=#1a1b26]"
        state: "#[fg=#f7768e,bold]"
        branch: "#[fg=#7aa2f7,bold]"
        remote: "#[fg=#7dcfff]"
        divergence: "#[fg=#e0af68]"
        staged: "#[fg=#9ece6a,bold]"
        conflict: "#[fg=#f7768e,bold]"
        modified: "#[fg=#e0af68,bold]"
        untracked: "#[fg=#bb9af7,bold]"
        stashed: "#[fg=#7dcfff,bold]"
        insertions: "#[fg=#9ece6a]"
        deletions: "#[fg=#f7768e]"
        clean: "#[fg=#9ece6a,bold]"

    layout: [branch, divergence, " ", flags, " "]

    options:
        branch_max_len: 30
        branch_trim: right
        ellipsis: "…"
        hide_clean: false
        swap_divergence: false
        divergence_space: true
        flags_without_count: false
